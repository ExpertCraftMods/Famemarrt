<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PointPilot — Tasks</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <header class="header">
    <div class="container nav">
      <div class="brand"><i></i> <span>PointPilot</span></div>
      <nav style="margin-left:auto; display:flex; gap:8px;">
        <a href="./index.html">Home</a>
        <a class="active" href="./tasks.html">Tasks</a>
        <a href="./offers.html">Offers</a>
        <a href="./referral.html">Referral</a>
        <a href="./profile.html">Profile</a>
        <a href="./admin.html">Admin</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h2>Surveys, videos, and offers</h2>
      <div class="tasks" id="tasks"></div>
    </section>
  </main>

  <footer class="footer container">
    <small>For demo only. Completing tasks updates points locally.</small>
  </footer>

  <script type="module">
    import { onReady, getState, completeTask } from './js/app.js';

    function render() {
      const tasksEl = document.getElementById('tasks');
      const state = getState();
      tasksEl.innerHTML = '';
      state.tasks.forEach(t => {
        const div = document.createElement('div');
        div.className = 'task';
        div.innerHTML = `
          <div>
            <h3>${t.title} · <span style="color:#9ca3af;font-weight:500;">${t.points} pts</span></h3>
            <p>${t.description}</p>
          </div>
          <div>
            ${t.status === 'completed' ? '<button class="btn secondary" disabled>Completed</button>' : `<button class=\"btn\" data-id=\"${t.id}\">Complete</button>`}
          </div>`;
        tasksEl.appendChild(div);
      });

      document.querySelectorAll('button[data-id]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const id = e.currentTarget.getAttribute('data-id');
          completeTask(id);
          render();
        });
      });
    }

    onReady(render);
  </script>
</body>
</html>
